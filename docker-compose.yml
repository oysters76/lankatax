name: lankatax-ai

# Shared by every application container: the database lives on the Compose
# network and local Hatchet is reached by service name, never localhost.
x-app-environment: &app-environment
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  HATCHET_CLIENT_HOST_PORT: ${HATCHET_DOCKER_HOST_PORT:-hatchet-lite:7077}
  HATCHET_CLIENT_TLS_STRATEGY: ${HATCHET_DOCKER_TLS_STRATEGY:-none}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    image: lankatax-ai:local
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: ["app"]
    image: lankatax-ai:local
    build: .
    env_file: .env
    environment: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-pipeline:
    profiles: ["app"]
    image: lankatax-ai:local
    build: .
    command: ["python", "-m", "lankatax_ai.backend.jobs.worker_pipeline"]
    env_file: .env
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-maintenance:
    profiles: ["app"]
    image: lankatax-ai:local
    build: .
    command: ["python", "-m", "lankatax_ai.backend.jobs.worker_maintenance"]
    env_file: .env
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  hatchet-db:
    profiles: ["local-hatchet"]
    image: postgres:15.6
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: hatchet
      POSTGRES_DB: hatchet
    volumes:
      - hatchet_lite_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d hatchet -U hatchet"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  hatchet-lite:
    profiles: ["local-hatchet"]
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    ports:
      - "8888:8888"
      - "7077:7077"
    depends_on:
      hatchet-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://hatchet:hatchet@hatchet-db:5432/hatchet?sslmode=disable"
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_GRPC_PORT: "7077"
      SERVER_URL: http://localhost:8888
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
    volumes:
      - hatchet_lite_config:/config

volumes:
  pgdata:
  hatchet_lite_postgres_data:
  hatchet_lite_config:
