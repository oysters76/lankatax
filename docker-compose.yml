services:
    db:
        image: pgvector/pgvector:pg16 
        environment:
            POSTGRES_DB: ${POSTGRES_DB_NAME}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "5433:5432" 
        volumes:
            - "pgdata:/var/lib/postgresql/data"
volumes:
    pgdata: 