[project]
name = "lankatax-ai"
version = "0.1.0"
description = "LKR Tax query software"
readme = "README.md"
authors = [
    { name = "chirath", email = "chirath.nishshanka@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "typer>=0.28.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
lankatax = "lankatax_ai.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "psycopg2-binary>=2.9",
    "pytest>=9.2.0",
    "pytest-asyncio>=0.26",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session" 

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true